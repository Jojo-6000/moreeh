<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Moreeh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#F4F2FB;color:#1A0B5C;font-family:Sora,system-ui,sans-serif;font-size:14px}
button,input,select{font:inherit;color:inherit}
.app{display:flex;min-height:100vh}
.side{width:220px;background:#1A0B5C;color:#fff;padding:22px 14px;flex-shrink:0;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:8px;padding:0 8px}.brand span{width:30px;height:30px;border-radius:9px;background:#D4FF3A;color:#1A0B5C;display:flex;align-items:center;justify-content:center;font-weight:800}
.appsw{margin:18px 4px 16px;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.08);font-size:12.5px;display:flex;gap:8px}.appsw b span{color:#D4FF3A}
.nav{display:flex;align-items:center;gap:10px;height:40px;padding:0 12px;border-radius:12px;font-size:13px;color:#C9BEFF;font-weight:600;background:none;border:0;width:100%;text-align:left;cursor:pointer}
.nav:hover{background:rgba(255,255,255,.06)}.nav.on{background:#5B2EFF;color:#fff}.nav[disabled]{opacity:.45;cursor:default}.nav small{margin-left:auto;font-size:10px;opacity:.8}
.nav i{font-style:normal;margin-left:auto;font-size:11px;background:#FFB547;color:#1A0B5C;border-radius:9px;padding:1px 7px;font-weight:800}
.who{margin-top:auto;display:flex;align-items:center;gap:9px;padding:0 8px;font-size:12px}.who span{width:30px;height:30px;border-radius:15px;background:#5B2EFF;display:flex;align-items:center;justify-content:center;font-weight:800}
.main{flex:1;padding:24px 28px;min-width:0}
.h{font-size:24px;font-weight:800;letter-spacing:-.03em;margin:0}
.sub{font-size:12.5px;color:#7A6FAE}
.card{background:#fff;border-radius:18px;padding:16px 18px;box-shadow:0 1px 0 #E6E1F7}
.kpis{display:flex;gap:14px;margin-top:20px;flex-wrap:wrap}.kpis .card{flex:1;min-width:140px}
.kl{font-size:11px;font-weight:700;color:#7A6FAE;letter-spacing:.04em}.kv{font-size:26px;font-weight:800;letter-spacing:-.03em;margin-top:4px}.ks{font-size:11.5px;color:#7A6FAE;margin-top:2px}
.tb{width:100%;border-collapse:collapse;font-size:12.5px}.tb th{text-align:left;font-size:11px;color:#7A6FAE;font-weight:700;padding:8px 10px;border-bottom:1px solid #ECE8FA}.tb td{padding:10px 8px;border-bottom:1px solid #F2EFFB;white-space:nowrap}
.tag{display:inline-block;padding:3px 9px;border-radius:10px;font-size:11px;font-weight:700}
.live{background:#E4F7D0;color:#1A7F3C}.off{background:#FDE2DF;color:#B3261E}.done{background:#EEE;color:#666}
.b{display:inline-flex;align-items:center;justify-content:center;height:36px;padding:0 14px;border-radius:18px;font-size:12.5px;font-weight:700;background:#fff;border:1px solid #DDD6F5;cursor:pointer}
.b.p{background:#5B2EFF;color:#fff;border-color:#5B2EFF}.b.l{background:#D4FF3A;border-color:#D4FF3A}.b.r{color:#B3261E;border-color:#F0C9C5}.b.s{height:28px;padding:0 10px;font-size:11.5px}
.b[disabled]{opacity:.5;cursor:default}
.in{height:38px;border-radius:12px;border:1px solid #DDD6F5;background:#fff;padding:0 12px;width:100%}
.in:focus{outline:2px solid #5B2EFF;outline-offset:1px}
.lab{display:block;font-size:11px;font-weight:700;color:#7A6FAE;margin:12px 0 5px}
.seg{display:flex;gap:6px}.seg .b.on{background:#5B2EFF;color:#fff;border-color:#5B2EFF}
.chk{display:flex;align-items:center;gap:10px;height:40px;border:1px solid #DDD6F5;border-radius:12px;padding:0 12px;background:#fff}
.chk input[type=number]{margin-left:auto;width:90px;height:30px;border:1px solid #ECE8FA;border-radius:8px;padding:0 8px;text-align:right}
.row2{display:flex;gap:10px}.row2>*{flex:1}
.bar{width:90px;height:6px;border-radius:3px;background:#ECE8FA}.bar div{height:6px;border-radius:3px;background:#5B2EFF}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1A0B5C;color:#fff;padding:12px 18px;border-radius:14px;font-size:13px;z-index:9}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#1A0B5C}
.login .card{width:360px;padding:28px}
.codes{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:#F4F2FB;border-radius:12px;padding:12px;max-height:180px;overflow:auto;white-space:pre}
.err{color:#B3261E;font-size:12.5px;margin-top:10px}
@media (max-width:900px){.side{display:none}.main{padding:16px}}
.card.click{cursor:pointer;text-align:left;border:0;font:inherit;color:inherit;transition:transform .12s,box-shadow .12s}
.card.click:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(26,11,92,.12)}
.card.click:focus-visible{outline:2px solid #5B2EFF;outline-offset:2px}
.card.click .more{font-size:11px;font-weight:700;color:#5B2EFF;margin-top:8px}
.bad .kv{color:#B3261E}.good .kv{color:#1A7F3C}
.panel-bg{position:fixed;inset:0;background:rgba(26,11,92,.35);z-index:8;display:flex;justify-content:flex-end}
.panel{width:min(760px,100%);height:100%;background:#fff;box-shadow:-10px 0 30px rgba(26,11,92,.2);padding:22px 24px;overflow:auto}
.appsw{cursor:pointer;border:0;color:#fff;width:calc(100% - 8px);text-align:left;font:inherit}
.dd{background:#fff;color:#1A0B5C;border-radius:14px;padding:6px;margin:-8px 4px 12px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.dd button{display:flex;align-items:center;gap:8px;width:100%;height:36px;border:0;background:none;border-radius:10px;padding:0 10px;font:inherit;font-size:13px;cursor:pointer;color:inherit;text-align:left}
.dd button:hover{background:#F4F2FB}
.pdot{width:10px;height:10px;border-radius:5px;flex-shrink:0;display:inline-block}
.pcard{display:flex;gap:14px;align-items:center}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;margin-top:16px}
.sw{display:flex;gap:6px}.sw button{width:28px;height:28px;border-radius:14px;border:2px solid transparent;cursor:pointer}.sw button.on{border-color:#1A0B5C;box-shadow:0 0 0 2px #fff inset}
.help{max-width:860px}
.help h2{font-size:18px;margin:28px 0 8px;letter-spacing:-.02em}
.help p,.help li{font-size:13.5px;line-height:1.6}
.help .tb td{white-space:normal}.help ol{padding-left:20px}.help li{margin:6px 0}
.pre{position:relative;background:#1A0B5C;color:#E6DEFF;border-radius:12px;padding:12px 14px;font-family:ui-monospace,Menlo,monospace;font-size:12px;white-space:pre-wrap;word-break:break-all;margin:8px 0}
.pre .cp{position:absolute;right:8px;top:8px;height:26px;padding:0 10px;border-radius:13px;border:0;background:#D4FF3A;color:#1A0B5C;font:inherit;font-size:11px;font-weight:700;cursor:pointer}
.toc{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.flow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:12px 0}.flow .card{padding:12px 14px;font-size:12.5px}.flow b{display:block;font-size:13.5px}
.callout{border-left:4px solid #5B2EFF;background:#F4F2FB;border-radius:10px;padding:10px 14px;font-size:13px;line-height:1.55;margin:10px 0}
.callout.warn{border-color:#B3261E;background:#FDF0EE}
.sh{font-size:16px;margin:26px 0 10px;letter-spacing:-.02em}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:1100px){.g2,.g3{grid-template-columns:1fr}}
.hb{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:12.5px}.hbl{width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hb b{width:54px;text-align:right}
.hbt{flex:1;height:10px;border-radius:5px;background:#ECE8FA;display:block;overflow:hidden}.hbt span{display:block;height:100%;border-radius:5px;background:#5B2EFF}
.fn{display:flex;align-items:center;gap:12px;margin:8px 0;font-size:13px}.fnl{width:190px}.fn b{width:60px;text-align:right}
.rowl{cursor:pointer}.rowl:hover td{background:#F8F6FE}
.act{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}.act>span:first-child{width:72px;font-size:12px;font-weight:700;color:#7A6FAE}.act .in{height:30px}
.note{border-top:1px solid #F2EFFB;padding:8px 0;font-size:13px}
.sup{display:flex;gap:14px;margin-top:16px;align-items:stretch;min-height:520px}
.thl{width:300px;flex-shrink:0;padding:6px;max-height:calc(100vh - 150px);overflow:auto}
.th{display:block;width:100%;text-align:left;border:0;background:none;border-radius:12px;padding:10px;cursor:pointer;font-size:12.5px;color:inherit}.th:hover{background:#F8F6FE}.th.on{background:#EEE9FF}
.msgs{flex:1;display:flex;flex-direction:column;gap:10px;margin:14px 0;max-height:calc(100vh - 360px);min-height:200px;overflow:auto;padding-right:4px}
.msg{max-width:80%;padding:10px 12px;border-radius:14px;font-size:13px}.msg.usr{background:#F4F2FB;align-self:flex-start}.msg.adm{background:#5B2EFF;color:#fff;align-self:flex-end}.msg.adm .ks{color:#D9D0FF}.msg.int{background:#FFF6DC;border:1px dashed #E0B341;align-self:flex-end}
.kvl{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;margin-top:8px}.kvl span{color:#7A6FAE}
@media (max-width:1100px){.sup{flex-direction:column}.thl{width:auto;max-height:300px}.sup>.card[style*="width:260px"]{width:auto!important}}
textarea.in{font-family:inherit}
a{color:#5B2EFF}
</style>
</head>
<body>
<div id="root"></div>
<script>
/* ---------- projects & connections ---------- */
// The home project (J@rd) keeps Moreeh's own settings, including the list of other projects.
var HOME = {
  id: "home", name: "J@rd", color: "#5B2EFF", env: "production", home: true,
  supabase_url: "https://joiqrksolnlkhkedsqly.supabase.co",
  publishable_key: "sb_publishable_YKx3A2YLokGQkg5sWPF9-Q_qLt-s-t6",   // publishable key: safe in a web page
  api_url: "https://joiqrksolnlkhkedsqly.supabase.co/functions/v1/moreeh"
};
var M = {
  projects: [HOME], cur: "home", conn: {}, page: "overview", ov: null, coupons: null, audit: null, detail: null, dd: false,
  pform: null, login: null, busy: false, err: "",
  form: { kind: "shared", gTickets: true, tickets: 20, gPlus: false, plus_days: 30, gStorage: false, storage_gb: 5, storage_days: 30, per_user: 1, count: 100 }, created: null
};
try { M.cur = localStorage.getItem("moreeh_cur") || "home"; } catch (e) {}
var CLIENTS = {};
function proj(id) { return M.projects.filter(function (p) { return p.id === (id || M.cur); })[0] || HOME; }
function client(p) {
  p = p || proj();
  if (!CLIENTS[p.id]) CLIENTS[p.id] = window.supabase.createClient(p.supabase_url, p.publishable_key, { auth: { storageKey: "moreeh-" + p.id, persistSession: true } });
  return CLIENTS[p.id];
}
var $ = function (id) { return document.getElementById(id); };
function esc(t) { return String(t == null ? "" : t).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
function n(x) { return Number(x || 0).toLocaleString(); }
function day(iso) { return iso ? new Date(iso).toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" }) : "—"; }
function when(iso) { if (!iso) return "—"; var d = new Date(iso); return isNaN(d) ? esc(iso) : d.toLocaleDateString(undefined, { day: "numeric", month: "short" }) + " " + d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" }); }
function toast(m) { var t = document.createElement("div"); t.className = "toast"; t.textContent = m; document.body.appendChild(t); setTimeout(function () { t.remove(); }, 3200); }

function api(action, extra, p) {
  p = p || proj();
  return client(p).auth.getSession().then(function (r) {
    var s = r.data && r.data.session; if (!s) throw { error: "signed_out" };
    return fetch(p.api_url, { method: "POST", headers: { "Content-Type": "application/json", Authorization: "Bearer " + s.access_token }, body: JSON.stringify(Object.assign({ action: action }, extra || {})) });
  }).then(function (r) {
    return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok) throw Object.assign({ status: r.status }, j); return j; });
  }, function (e) { throw e && e.error ? e : { error: "unreachable" }; });
}
var CONN_TXT = {
  signed_out: "Not signed in", not_admin: "This account isn’t an admin in this project", unauthorized: "Signed out — sign in again",
  unreachable: "Can’t reach the connector (check the Moreeh API URL and that the function is deployed)", bad_action: "Connector is out of date"
};
function connect(p) {
  M.conn[p.id] = { state: "checking" }; render();
  return api("me", {}, p).then(function (j) { M.conn[p.id] = { state: "ok", me: j }; render(); return true; })
    .catch(function (e) {
      var code = e && e.error ? e.error : "unreachable";
      if (e && e.status === 404) code = "unreachable";
      M.conn[p.id] = { state: code === "signed_out" || code === "unauthorized" ? "signin" : "error", code: code }; render(); return false;
    });
}
function me() { var c = M.conn[M.cur]; return c && c.state === "ok" ? c.me : null; }
function has(f) { var m = me(); return !!(m && (m.features || []).indexOf(f) >= 0); }
function loadProjects() {
  return api("projects", {}, HOME).then(function (j) {
    M.projects = [HOME].concat((j.projects || []).map(function (p) { return Object.assign({}, p, { id: p.id }); }));
    if (!M.projects.some(function (p) { return p.id === M.cur; })) M.cur = "home";
    render();
  }).catch(function () {});
}
function switchTo(id) {
  M.cur = id; M.dd = false; M.ov = M.coupons = M.audit = M.detail = null; M.created = null;
  try { localStorage.setItem("moreeh_cur", id); } catch (e) {}
  if (["projects", "help"].indexOf(M.page) >= 0) M.page = "overview";
  M.ins = M.users = M.usel = M.udata = M.saf = M.sup = M.thr = null; M.supUnread = 0;
  connect(proj()).then(function (ok) { if (ok) goPage(has(M.page) ? M.page : "overview"); });
}

/* ---------- sign-in ---------- */
function vLogin(p) {
  var other = !p.home;
  return '<div class="login"><form class="card" id="f-login" data-proj="' + esc(p.id) + '"><div class="brand" style="padding:0"><span>M</span><b style="font-size:18px">Moreeh</b></div>' +
    (other ? '<div class="callout" style="margin-top:14px"><span class="pdot" style="background:' + esc(p.color) + '"></span> <b>' + esc(p.name) + '</b><br>Sign in with your admin account <b>in this app</b>. Each project has its own login.</div>'
      : '<p class="sub" style="margin:10px 0 6px">Admin sign-in. Use your J@rd account; only admins get in.</p>') +
    '<label class="lab" for="em">EMAIL</label><input class="in" id="em" type="email" autocomplete="username" required>' +
    '<label class="lab" for="pw">PASSWORD</label><input class="in" id="pw" type="password" autocomplete="current-password" required>' +
    (M.err ? '<div class="err">' + esc(M.err) + "</div>" : "") +
    '<button class="b p" type="submit" style="width:100%;margin-top:16px;height:42px"' + (M.busy ? " disabled" : "") + ">" + (M.busy ? "Signing in…" : "Sign in") + "</button>" +
    (other ? '<button type="button" class="b" data-a="cancel-login" style="width:100%;margin-top:8px">Back to J@rd</button>' : "") + "</form></div>";
}

/* ---------- shell ---------- */
var NAV = [["overview", "▦", "Overview"], ["insights", "◔", "Insights"], ["users", "◉", "Users"], ["support", "✉", "Support"], ["safety", "⚑", "Safety review"], ["coupons", "◆", "Coupons"], ["audit", "≡", "Audit log"]];
function shell(body) {
  var p = proj(), m = me() || {};
  var nav = NAV.filter(function (x) { return x[0] === "overview" || x[0] === "audit" || has(x[0]); }).map(function (x) {
    var badge = x[0] === "safety" && M.ov && M.ov.safety_holds ? "<i>" + M.ov.safety_holds + "</i>" : x[0] === "support" && M.supUnread ? "<i>" + M.supUnread + "</i>" : "";
    return '<button class="nav' + (M.page === x[0] ? " on" : "") + '" ' + (x[3] ? "disabled" : 'data-p="' + x[0] + '"') + '><span style="width:16px;text-align:center">' + x[1] + "</span>" + x[2] + (x[3] ? "<small>soon</small>" : badge) + "</button>";
  }).join("");
  var dd = M.dd ? '<div class="dd">' + M.projects.map(function (q) {
    return '<button data-a="switch" data-id="' + esc(q.id) + '"><span class="pdot" style="background:' + esc(q.color) + '"></span>' + esc(q.name) + (q.env === "test" ? ' <span class="tag done">test</span>' : "") + (q.id === M.cur ? '<span style="margin-left:auto">✓</span>' : "") + "</button>";
  }).join("") + '<button data-p="projects" style="color:#5B2EFF;font-weight:700">＋ Manage projects</button></div>' : "";
  var em = m.email || "";
  return '<div class="app"><aside class="side"><div class="brand"><span>M</span><b style="font-size:16px">Moreeh</b></div>' +
    '<button class="appsw" data-a="dd" aria-expanded="' + M.dd + '"><span class="pdot" style="background:' + esc(p.color) + ';margin-top:3px"></span><span style="min-width:0;flex:1"><b style="display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(p.name) + '</b><span style="color:#9C90D6;font-size:11px">' + esc(p.env) + '</span></span><span style="color:#9C90D6">▾</span></button>' + dd +
    '<nav style="display:flex;flex-direction:column;gap:2px">' + nav +
    '<div style="height:1px;background:rgba(255,255,255,.1);margin:10px 8px"></div>' +
    '<button class="nav' + (M.page === "projects" ? " on" : "") + '" data-p="projects"><span style="width:16px;text-align:center">⧉</span>Projects</button>' +
    '<button class="nav' + (M.page === "help" ? " on" : "") + '" data-p="help"><span style="width:16px;text-align:center">?</span>Help</button></nav>' +
    '<div class="who"><span>' + esc(em.charAt(0).toUpperCase() || "?") + '</span><div><b>' + esc(em || "Not signed in") + '</b><div style="color:#9C90D6;font-size:11px">' + esc(m.role || "") + ' · <a href="#" data-a="logout" style="color:#D4FF3A">Sign out</a></div></div></div></aside>' +
    '<main class="main">' + body + "</main></div>" + (M.detail ? vDetail() : "");
}

/* ---------- overview ---------- */
function vOverview() {
  var o = M.ov, p = proj();
  if (!o) return '<h1 class="h">Overview</h1><p class="sub">Loading…</p>';
  var kpis = o.kpis || [];
  var cards = kpis.map(function (k) {
    var tag = k.detail ? "button" : "div";
    return "<" + tag + ' class="card' + (k.detail ? " click" : "") + (k.tone ? " " + k.tone : "") + '"' + (k.detail ? ' data-a="kpi" data-k="' + esc(k.detail) + '" aria-label="' + esc(k.label + ": " + k.value + ". Show the list") + '"' : "") + '><div class="kl">' + esc(String(k.label).toUpperCase()) + '</div><div class="kv">' + esc(k.value) + '</div><div class="ks">' + esc(k.sub || "") + "</div>" + (k.detail ? '<div class="more">View list →</div>' : "") + "</" + tag + ">";
  }).join("");
  var ch = o.chart, chart = "";
  if (ch && ch.points && ch.points.length) {
    var pd = ch.points, mx = Math.max.apply(null, pd.map(function (d) { return d.value; }).concat([1])), W = 40, H = 150;
    var bars = pd.map(function (d, i) { var h = Math.max(2, d.value / mx * H); return '<rect x="' + (i * W) + '" y="' + (H - h + 14) + '" width="26" height="' + h + '" rx="6" fill="' + (i === pd.length - 1 ? "#5B2EFF" : "#C9BEFF") + '"><title>' + esc(d.day) + ": " + d.value + '</title></rect><text x="' + (i * W + 13) + '" y="' + (H + 30) + '" font-size="10" fill="#7A6FAE" text-anchor="middle">' + String(d.day).slice(8) + "</text>" + (d.value ? '<text x="' + (i * W + 13) + '" y="' + (H - h + 9) + '" font-size="10" font-weight="700" fill="#5B2EFF" text-anchor="middle">' + d.value + "</text>" : ""); }).join("");
    chart = '<div class="card" style="margin-top:14px"><div style="display:flex;justify-content:space-between"><b>' + esc(ch.title) + '</b><span class="ks">' + esc(ch.note || "") + '</span></div><svg width="100%" height="190" viewBox="0 0 ' + (pd.length * W) + ' 190" preserveAspectRatio="xMinYMid meet" role="img" aria-label="' + esc(ch.title) + '">' + bars + "</svg></div>";
  }

    M.busy = false; M.err = ""; rememberUid(HOME);
    loadProjects().then(function () {
      if (M.cur === "home") goPage("overview");
      else connect(proj()).then(function (ok2) { if (ok2) rememberUid(proj()); goPage("overview"); });
    });
  });
}

/* ---------- events ---------- */
document.addEventListener("submit", function (e) {
  e.preventDefault();
  var f = e.target;
  if (f.id === "f-login") {
    var p = proj(f.getAttribute("data-proj"));
    M.busy = true; M.err = ""; render();
    var em = f.querySelector("#em"), pw = f.querySelector("#pw");
    client(p).auth.signInWithPassword({ email: em ? em.value.trim() : "", password: pw ? pw.value : "" }).then(function (r) {
      if (r.error) { M.busy = false; M.err = "Wrong email or password."; render(); return; }
      if (p.home) { M.login = null; startHome(); return; }
      M.login = null; M.busy = false; M.cur = p.id;
      connect(p).then(function (ok) { if (ok) { rememberUid(p); goPage(M.page === "projects" ? "projects" : "overview"); } else if (M.conn[p.id].code === "not_admin") { client(p).auth.signOut(); toast("That account isn’t an admin in " + p.name + "."); } });
    });
  }
  if (f.id === "f-coupon") createCoupon();
  if (f.id === "f-uq") { M.uq = ($("u-q") || {}).value || ""; loadUsers(); }
  if (f.id === "f-note") userAction("note");
  if (f.id === "f-reply") sendReply((e.submitter && e.submitter.dataset.v) || "waiting");
  if (f.id === "f-proj") saveProject();
});
document.addEventListener("input", function (e) {
  if (e.target.id === "d-q" && M.detail) { M.detail.q = e.target.value; M.focus = "d-q"; render(); }
  if (e.target.id === "p-url" && M.pform) { var u = e.target.value.trim().replace(/\/+$/, ""); var api$ = $("p-api"); if (api$ && (!api$.value || /\/functions\/v1\/moreeh$/.test(api$.value))) api$.value = /^https:\/\/[a-z0-9-]+\.supabase\.co$/.test(u) ? u + "/functions/v1/moreeh" : api$.value; }
});
document.addEventListener("keydown", function (e) { if (e.key === "Enter" && e.target.classList && e.target.classList.contains("rowl")) { openUser(e.target.dataset.id); return; } if (e.key === "Escape" && M.detail) { M.detail = null; render(); } if (e.key === "Escape" && M.dd) { M.dd = false; render(); } });
document.addEventListener("click", function (e) {
  if (e.target.closest("[data-stop]") && !e.target.closest("[data-a],[data-p]")) return;
  var t = e.target.closest("[data-p],[data-a]"); if (!t) { if (M.dd) { M.dd = false; render(); } return; }
  if (t.dataset.p) { e.preventDefault(); M.detail = null; goPage(t.dataset.p, t.dataset.sec); return; }
  var a = t.dataset.a;
  if (a === "close-detail") { if (e.target.closest("[data-stop]") && t.classList.contains("panel-bg")) return; M.detail = null; render(); }
  if (a === "kpi") openDetail(t.dataset.k, t.getAttribute("aria-label"));
  if (a === "d-csv") detailCsv();
  if (a === "dd") { M.dd = !M.dd; render(); }
  if (a === "switch") switchTo(t.dataset.id);
  if (a === "test") connect(proj(t.dataset.id)).then(function (ok) { toast(ok ? "Connected to " + proj(t.dataset.id).name + "." : CONN_TXT[(M.conn[t.dataset.id] || {}).code] || "Sign in needed."); });
  if (a === "signin") { M.login = t.dataset.id; M.err = ""; render(); }
  if (a === "cancel-login") { M.login = null; M.err = ""; if (M.cur !== "home") switchTo("home"); else render(); }
  if (a === "new-proj") { M.pform = { color: COLORS[(M.projects.length) % COLORS.length], env: "production" }; M.err = ""; render(); }
  if (a === "edit-proj") { M.pform = Object.assign({}, proj(t.dataset.id)); M.err = ""; render(); }
  if (a === "cancel-proj") { M.pform = null; M.err = ""; render(); }
  if (a === "pcolor") { readProj(); M.pform.color = t.dataset.c; render(); }
  if (a === "penv") { readProj(); M.pform.env = t.dataset.v; render(); }
  if (a === "del-proj") {
    var p = proj(t.dataset.id);
    if (!confirm("Remove " + p.name + " from Moreeh? The app and its data are not touched.")) return;
    api("project-delete", { id: p.id }, HOME).then(function () { toast("Removed " + p.name + "."); if (M.cur === p.id) M.cur = "home"; return loadProjects(); }).catch(function () { toast("Couldn’t remove it."); });
  }
  if (a === "jump") { var el = $("h-" + t.dataset.sec); if (el) el.scrollIntoView({ behavior: "smooth" }); }
  if (a === "copy-pre") { var txt = t.parentNode.textContent.replace(/^Copy/, ""); if (navigator.clipboard) navigator.clipboard.writeText(txt); toast("Copied."); }
  if (a === "logout") { e.preventDefault(); client().auth.signOut().then(function () { if (M.cur === "home") { M.conn = {}; } else { M.conn[M.cur] = { state: "signin" }; } render(); }); }
  if (a === "kind") { readForm(); M.form.kind = t.dataset.k; render(); }
  if (a === "ins-days") { M.insDays = Number(t.dataset.v); M.ins = null; render(); loadInsights(); }
  if (a === "uf") { M.uf = t.dataset.v; M.uq = ($("u-q") || {}).value || M.uq || ""; loadUsers(); }
  if (a === "open-user") { e.preventDefault(); M.detail = null; openUser(t.dataset.id); }
  if (a === "close-user") { M.usel = null; M.udata = null; if (!M.users) loadUsers(); else render(); }
  if (a === "ua") userAction(t.dataset.op);
  if (a === "sa") safetyAction(t.dataset.id, t.dataset.op);
  if (a === "sup-tab") { M.sup = { status: t.dataset.v }; render(); loadSupport(); }
  if (a === "open-thread") openThread(t.dataset.id);
  if (a === "sup-status") { if (M.thr) { var dr = $("r-body"); M.thr.draft = dr ? dr.value : ""; } sendReply(t.dataset.v, true); }
  if (a === "new") { M.created = null; render(); }
  if (a === "csv") csv();
  if (a === "copy") { navigator.clipboard && navigator.clipboard.writeText(M.created.codes[0]); toast("Copied " + M.created.codes[0]); }
  if (a === "toggle") {
    t.disabled = true;
    api("coupon-toggle", { id: t.dataset.id, active: t.dataset.on === "1" }).then(function () { toast(t.dataset.on === "1" ? "Coupon switched on." : "Coupon switched off. The code stops working now."); loadCoupons(); }).catch(function () { t.disabled = false; toast("Couldn’t change it."); });
  }
});
render();
client(HOME).auth.getSession().then(function (r) { if (r.data && r.data.session) startHome(); else render(); });
</script>
</body>
</html>
