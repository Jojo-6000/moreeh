<body>
<div id="root"></div>
<script>
/* ---------- projects & connections ---------- */
// The home project (J@rd) keeps Moreeh's own settings, including the list of other projects.
var HOME = {
  id: "home", name: "J@rd", color: "#5B2EFF", env: "production", home: true,
  supabase_url: "https://joiqrksolnlkhkedsqly.supabase.co",
  publishable_key: "sb_publishable_YKx3A2YLokGQkg5sWPF9-Q_qLt-s-t6",   // publishable key: safe in a web page
  api_url: "https://joiqrksolnlkhkedsqly.supabase.co/functions/v1/moreeh"
};
var M = {
  projects: [HOME], cur: "home", conn: {}, page: "overview", ov: null, coupons: null, audit: null, detail: null, dd: false,
  pform: null, login: null, busy: false, err: "",
  form: { kind: "shared", gTickets: true, tickets: 20, gPlus: false, plus_days: 30, gStorage: false, storage_gb: 5, storage_days: 30, per_user: 1, count: 100 }, created: null
};
try { M.cur = localStorage.getItem("moreeh_cur") || "home"; } catch (e) {}
var CLIENTS = {};
function proj(id) { return M.projects.filter(function (p) { return p.id === (id || M.cur); })[0] || HOME; }
function client(p) {
  p = p || proj();
  if (!CLIENTS[p.id]) CLIENTS[p.id] = window.supabase.createClient(p.supabase_url, p.publishable_key, { auth: { storageKey: "moreeh-" + p.id, persistSession: true } });
  return CLIENTS[p.id];
}
var $ = function (id) { return document.getElementById(id); };
function esc(t) { return String(t == null ? "" : t).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
function n(x) { return Number(x || 0).toLocaleString(); }
function day(iso) { return iso ? new Date(iso).toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" }) : "—"; }
function when(iso) { if (!iso) return "—"; var d = new Date(iso); return isNaN(d) ? esc(iso) : d.toLocaleDateString(undefined, { day: "numeric", month: "short" }) + " " + d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" }); }
function toast(m) { var t = document.createElement("div"); t.className = "toast"; t.textContent = m; document.body.appendChild(t); setTimeout(function () { t.remove(); }, 3200); }

function api(action, extra, p) {
  p = p || proj();
  return client(p).auth.getSession().then(function (r) {
    var s = r.data && r.data.session; if (!s) throw { error: "signed_out" };
    return fetch(p.api_url, { method: "POST", headers: { "Content-Type": "application/json", Authorization: "Bearer " + s.access_token }, body: JSON.stringify(Object.assign({ action: action }, extra || {})) });
  }).then(function (r) {
    return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok) throw Object.assign({ status: r.status }, j); return j; });
  }, function (e) { throw e && e.error ? e : { error: "unreachable" }; });
}
var CONN_TXT = {
  signed_out: "Not signed in", not_admin: "This account isn’t an admin in this project", unauthorized: "Signed out — sign in again",
  unreachable: "Can’t reach the connector (check the Moreeh API URL and that the function is deployed)", bad_action: "Connector is out of date"
};
function connect(p) {
  M.conn[p.id] = { state: "checking" }; render();
  return api("me", {}, p).then(function (j) { M.conn[p.id] = { state: "ok", me: j }; render(); return true; })
    .catch(function (e) {
      var code = e && e.error ? e.error : "unreachable";
      if (e && e.status === 404) code = "unreachable";
      M.conn[p.id] = { state: code === "signed_out" || code === "unauthorized" ? "signin" : "error", code: code }; render(); return false;
    });
}
function me() { var c = M.conn[M.cur]; return c && c.state === "ok" ? c.me : null; }
function has(f) { var m = me(); return !!(m && (m.features || []).indexOf(f) >= 0); }
function loadProjects() {
  return api("projects", {}, HOME).then(function (j) {
    M.projects = [HOME].concat((j.projects || []).map(function (p) { return Object.assign({}, p, { id: p.id }); }));
    if (!M.projects.some(function (p) { return p.id === M.cur; })) M.cur = "home";
    render();
  }).catch(function () {});
}
function switchTo(id) {
  M.cur = id; M.dd = false; M.ov = M.coupons = M.audit = M.detail = null; M.created = null;
  try { localStorage.setItem("moreeh_cur", id); } catch (e) {}
  if (["projects", "help"].indexOf(M.page) >= 0) M.page = "overview";
  M.idet = null; M.ai = M.ins = M.users = M.usel = M.udata = M.saf = M.sup = M.thr = null; M.supUnread = 0;
  connect(proj()).then(function (ok) { if (ok) goPage(has(M.page) ? M.page : "overview"); });
}

/* ---------- sign-in ---------- */
function vLogin(p) {
  var other = !p.home;
  return '<div class="login"><form class="card" id="f-login" data-proj="' + esc(p.id) + '"><div class="brand" style="padding:0"><span>M</span><b style="font-size:18px">Moreeh</b></div>' +
    (other ? '<div class="callout" style="margin-top:14px"><span class="pdot" style="background:' + esc(p.color) + '"></span> <b>' + esc(p.name) + '</b><br>Sign in with your admin account <b>in this app</b>. Each project has its own login.</div>'
      : '<p class="sub" style="margin:10px 0 6px">Admin sign-in. Use your J@rd account; only admins get in.</p>') +

  else if (!c || c.state === "checking") body = '<div class="connl"><div class="mload"><span></span><span></span><span></span></div><p class="sub" style="margin:0">Connecting to ' + esc(p.name) + "…</p></div>";
  else if (c.state === "signin") body = '<h1 class="h">' + esc(p.name) + '</h1><div class="card" style="margin-top:16px;max-width:520px"><b>Sign in to this project</b><p class="ks">Each app has its own admin login.</p><button class="b p" data-a="signin" data-id="' + esc(p.id) + '">Sign in to ' + esc(p.name) + "</button></div>";
  else if (c.state === "error") body = '<h1 class="h">' + esc(p.name) + '</h1><div class="card" style="margin-top:16px;max-width:620px;border-left:4px solid #B3261E"><b>' + esc(CONN_TXT[c.code] || c.code) + '</b><p class="ks">See <a href="#" data-p="help" data-sec="trouble">Troubleshooting</a>.</p><div style="display:flex;gap:8px"><button class="b" data-a="test" data-id="' + esc(p.id) + '">Try again</button><button class="b" data-a="signin" data-id="' + esc(p.id) + '">Sign in with another account</button></div></div>';
  else body = M.page === "coupons" && has("coupons") ? vCoupons() : M.page === "audit" ? vAudit() : M.page === "insights" && has("insights") ? vInsights() : /^ins:/.test(M.page) && has("insights") ? vInsDetail(M.page.slice(4)) : /^fin/.test(M.page) && has("finance") ? vFinance() : M.page === "users" && has("users") ? vUsers() : M.page === "safety" && has("safety") ? vSafety() : M.page === "support" && has("support") ? vSupport() : vOverview();
  r.innerHTML = shell(body);
  if (M.focus) { var f = $(M.focus); if (f) { f.focus(); try { f.setSelectionRange(f.value.length, f.value.length); } catch (e) {} } M.focus = null; }
}
function loadOverview() { if (has("support")) api("support", { status: "open" }).then(function (j) { M.supUnread = (j.counts || {}).unread || 0; render(); }).catch(function () {}); return api("overview").then(function (j) { M.ov = j; render(); }).catch(function (e) { authFail(e) || toast("Couldn’t load the overview."); }); }
function loadCoupons() { return api("coupons").then(function (j) { M.coupons = j.coupons; render(); }).catch(function (e) { authFail(e) || toast("Couldn’t load coupons."); }); }
function loadAudit() { return api("audit").then(function (j) { M.audit = j.audit; render(); }).catch(function (e) { authFail(e) || toast("Couldn’t load the audit log."); }); }
function authFail(e) { if (e && (e.error === "unauthorized" || e.error === "signed_out")) { M.conn[M.cur] = { state: "signin" }; render(); return true; } return false; }
function goPage(p, sec) {
  if (p === "fin:settings") M.finForm = null;
  M.page = p; M.err = ""; M.dd = false; render();
  var c = M.conn[M.cur];
  if (c && c.state === "ok") { if (p === "overview") loadOverview(); if (p === "coupons") loadCoupons(); if (p === "audit") loadAudit(); if (p === "insights") loadInsights(); if (/^ins:/.test(p)) { if (!M.ins) loadInsights(); else if (p === "ins:ai" && has("ai_usage")) loadAi(); M.idet = null; loadInsDetail(p.slice(4)); } if (/^fin/.test(p)) { if (!M.fin) loadFinance(); M.navOpen = M.navOpen || {}; M.navOpen.finance = true; } if (/^ins/.test(p)) { M.navOpen = M.navOpen || {}; M.navOpen.insights = true; } if (p === "users") { M.usel = null; loadUsers(); } if (p === "safety") loadSafety(); if (p === "support") loadSupport(); }
  if (p === "projects") M.projects.forEach(function (q) { if (!M.conn[q.id]) connect(q); });
  if (sec) setTimeout(function () { var el = $("h-" + sec); if (el) el.scrollIntoView({ behavior: "smooth" }); }, p === "help" ? 30 : 120);
}
function rememberUid(p) { return client(p).auth.getUser().then(function (u) { M.uid = M.uid || {}; M.uid[p.id] = u.data.user && u.data.user.id; }).catch(function () {}); }
function startHome() {
  M.conn.home = { state: "checking" }; render();
  connect(HOME).then(function (ok) {
    if (!ok) { var c = M.conn.home; if (c.code === "not_admin") { M.err = "This account isn’t a Moreeh admin."; client(HOME).auth.signOut(); } M.conn.home = null; M.busy = false; render(); return; }
    M.busy = false; M.err = ""; rememberUid(HOME);
    loadProjects().then(function () {
      if (M.cur === "home") goPage("overview");
      else connect(proj()).then(function (ok2) { if (ok2) rememberUid(proj()); goPage("overview"); });
    });
  });
}

/* ---------- events ---------- */
document.addEventListener("submit", function (e) {
  e.preventDefault();
  var f = e.target;
  if (f.id === "f-login") {
    var p = proj(f.getAttribute("data-proj"));
    M.busy = true; M.err = ""; render();
    var em = f.querySelector("#em"), pw = f.querySelector("#pw");
    client(p).auth.signInWithPassword({ email: em ? em.value.trim() : "", password: pw ? pw.value : "" }).then(function (r) {
      if (r.error) { M.busy = false; M.err = "Wrong email or password."; render(); return; }
      if (p.home) { M.login = null; startHome(); return; }
      M.login = null; M.busy = false; M.cur = p.id;
      connect(p).then(function (ok) { if (ok) { rememberUid(p); goPage(M.page === "projects" ? "projects" : "overview"); } else if (M.conn[p.id].code === "not_admin") { client(p).auth.signOut(); toast("That account isn’t an admin in " + p.name + "."); } });
    });
  }
  if (f.id === "f-coupon") createCoupon();
  if (f.id === "f-ai") saveAi();
  if (f.id === "f-fin") saveFin();
  if (f.id === "f-uq") { M.uq = ($("u-q") || {}).value || ""; loadUsers(); }
  if (f.id === "f-note") userAction("note");
  if (f.id === "f-reply") sendReply((e.submitter && e.submitter.dataset.v) || "waiting");
  if (f.id === "f-proj") saveProject();
});
document.addEventListener("change", function (e) {
  var t = e.target; if (!t || !t.dataset || t.dataset.a !== "con-ws") return;
  api("console-settings", { workspace_id: t.value }).then(function () { M.con = null; M.finCon = null; render(); loadConsole(true); if (M.fin) loadFinance(); toast("Workspace saved."); }).catch(function () { toast("Couldn’t save the workspace."); });
});
document.addEventListener("input", function (e) {
  if (e.target.classList && e.target.classList.contains("idq")) { M.idq = M.idq || {}; M.idq[e.target.dataset.i] = e.target.value; var i0 = e.target.dataset.i; render(); var el = document.querySelector('.idq[data-i="' + i0 + '"]'); if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); } return; }
  if (e.target.id === "d-q" && M.detail) { M.detail.q = e.target.value; M.focus = "d-q"; render(); }
  if (e.target.id === "p-url" && M.pform) { var u = e.target.value.trim().replace(/\/+$/, ""); var api$ = $("p-api"); if (api$ && (!api$.value || /\/functions\/v1\/moreeh$/.test(api$.value))) api$.value = /^https:\/\/[a-z0-9-]+\.supabase\.co$/.test(u) ? u + "/functions/v1/moreeh" : api$.value; }
});
document.addEventListener("keydown", function (e) { if (e.key === "Enter" && e.target.classList && e.target.classList.contains("rowl")) { openUser(e.target.dataset.id); return; } if ((e.key === "Enter" || e.key === " ") && e.target.classList && e.target.classList.contains("fcl")) { e.preventDefault(); goPage(e.target.dataset.p); return; } if (e.key === "Escape" && M.detail) { M.detail = null; render(); } if (e.key === "Escape" && M.dd) { M.dd = false; render(); } });
document.addEventListener("click", function (e) {
  if (e.target.closest("[data-stop]") && !e.target.closest("[data-a],[data-p]")) return;
  var t = e.target.closest("[data-p],[data-a]"); if (!t) { if (M.dd) { M.dd = false; render(); } return; }
  if (t.dataset.p) { e.preventDefault(); M.detail = null; goPage(t.dataset.p, t.dataset.sec); return; }
  var a = t.dataset.a;
  if (a === "close-detail") { if (e.target.closest("[data-stop]") && t.classList.contains("panel-bg")) return; M.detail = null; render(); }
  if (a === "kpi") openDetail(t.dataset.k, t.getAttribute("aria-label"));
  if (a === "ins-box") openInsBox(t.dataset.s, String(t.dataset.pick || "").split("|"), t.dataset.t || "");
  if (a === "d-csv") detailCsv();
  if (a === "dd") { M.dd = !M.dd; render(); }
  if (a === "switch") switchTo(t.dataset.id);
  if (a === "test") connect(proj(t.dataset.id)).then(function (ok) { toast(ok ? "Connected to " + proj(t.dataset.id).name + "." : CONN_TXT[(M.conn[t.dataset.id] || {}).code] || "Sign in needed."); });
  if (a === "signin") { M.login = t.dataset.id; M.err = ""; render(); }
  if (a === "cancel-login") { M.login = null; M.err = ""; if (M.cur !== "home") switchTo("home"); else render(); }
  if (a === "new-proj") { M.pform = { color: COLORS[(M.projects.length) % COLORS.length], env: "production" }; M.err = ""; render(); }
  if (a === "edit-proj") { M.pform = Object.assign({}, proj(t.dataset.id)); M.err = ""; render(); }
  if (a === "cancel-proj") { M.pform = null; M.err = ""; render(); }
  if (a === "pcolor") { readProj(); M.pform.color = t.dataset.c; render(); }
  if (a === "penv") { readProj(); M.pform.env = t.dataset.v; render(); }
  if (a === "del-proj") {
    var p = proj(t.dataset.id);
    if (!confirm("Remove " + p.name + " from Moreeh? The app and its data are not touched.")) return;
    api("project-delete", { id: p.id }, HOME).then(function () { toast("Removed " + p.name + "."); if (M.cur === p.id) M.cur = "home"; return loadProjects(); }).catch(function () { toast("Couldn’t remove it."); });
  }
  if (a === "jump") { var el = $("h-" + t.dataset.sec); if (el) el.scrollIntoView({ behavior: "smooth" }); }
  if (a === "copy-pre") { var txt = t.parentNode.textContent.replace(/^Copy/, ""); if (navigator.clipboard) navigator.clipboard.writeText(txt); toast("Copied."); }
  if (a === "logout") { e.preventDefault(); client().auth.signOut().then(function () { if (M.cur === "home") { M.conn = {}; } else { M.conn[M.cur] = { state: "signin" }; } render(); }); }
  if (a === "kind") { readForm(); M.form.kind = t.dataset.k; render(); }
  if (a === "ins-days") { M.insDays = Number(t.dataset.v); M.ins = null; M.ai = null; render(); loadInsights(); if (/^ins:/.test(M.page)) loadInsDetail(M.page.slice(4)); }
  if (a === "nav-tog") { M.navOpen = M.navOpen || {}; M.navOpen[t.dataset.v] = !M.navOpen[t.dataset.v]; render(); }
  if (a === "fin-days") { M.finDays = Number(t.dataset.v); M.fin = null; render(); loadFinance(); }
  if (a === "fx-add") { readFinForm(); M.finForm.fixed.push({ name: "", amount: "" }); render(); }
  if (a === "fx-del") { readFinForm(); M.finForm.fixed.splice(Number(t.dataset.i), 1); render(); }
  if (a === "id-csv") detCsv(t.dataset.i);
  if (a === "id-more") { e.preventDefault(); M.idmore = M.idmore || {}; M.idmore[t.dataset.i] = 1; render(); }
  if (a === "ai-edit") { M.aiEdit = !M.aiEdit; render(); }
  if (a === "con-refresh") loadConsole(true);
  if (a === "fin-ai") { M.finAiSrc = t.dataset.v; render(); }
  if (a === "uf") { M.uf = t.dataset.v; M.uq = ($("u-q") || {}).value || M.uq || ""; loadUsers(); }
  if (a === "open-user") { e.preventDefault(); M.detail = null; openUser(t.dataset.id); }
  if (a === "close-user") { M.usel = null; M.udata = null; if (!M.users) loadUsers(); else render(); }
  if (a === "ua") userAction(t.dataset.op);
  if (a === "sa") safetyAction(t.dataset.id, t.dataset.op);
  if (a === "sup-tab") { M.sup = { status: t.dataset.v }; render(); loadSupport(); }
  if (a === "open-thread") openThread(t.dataset.id);
  if (a === "sup-status") { if (M.thr) { var dr = $("r-body"); M.thr.draft = dr ? dr.value : ""; } sendReply(t.dataset.v, true); }
  if (a === "new") { M.created = null; render(); }
  if (a === "csv") csv();
  if (a === "copy") { navigator.clipboard && navigator.clipboard.writeText(M.created.codes[0]); toast("Copied " + M.created.codes[0]); }
  if (a === "toggle") {
    t.disabled = true;
    api("coupon-toggle", { id: t.dataset.id, active: t.dataset.on === "1" }).then(function () { toast(t.dataset.on === "1" ? "Coupon switched on." : "Coupon switched off. The code stops working now."); loadCoupons(); }).catch(function () { t.disabled = false; toast("Couldn’t change it."); });
  }
});
M.conn.home = { state: "checking" }; render();
var BOOT_T0 = Date.now();
client(HOME).auth.getSession().then(function (r) { setTimeout(function () { if (r.data && r.data.session) startHome(); else { M.conn.home = null; render(); } }, Math.max(0, 1200 - (Date.now() - BOOT_T0))); }).catch(function () { M.conn.home = null; render(); });
</script>
